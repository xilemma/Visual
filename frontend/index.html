<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>N-D Projection Studio</title>
<link rel="stylesheet" href="/css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1>N-D Projection Studio</h1>
    <div id="preset-toolbar" aria-label="Preset controls">
      <select id="preset-select" aria-label="Named preset" data-tooltip="Named presets are stored in this browser. Select one to load it; loads open paused so the saved pose is reproduced exactly.">
        <option value="">Current session</option>
      </select>
      <button id="preset-save-btn" data-tooltip="Updates the selected named preset. If none is selected, asks for a new preset name.">Save</button>
      <button id="preset-save-as-btn" data-tooltip="Saves the current structure, projection, ordered transforms, live phases, position, and camera view under a new name.">Save as…</button>
      <details id="preset-menu">
        <summary aria-label="More preset actions" data-tooltip="Rename, duplicate, delete, export, or import presets.">⋯</summary>
        <div class="preset-menu-popover">
          <button id="preset-rename-btn">Rename</button>
          <button id="preset-duplicate-btn">Duplicate</button>
          <button id="preset-delete-btn" class="danger-action">Delete</button>
          <hr />
          <button id="preset-export-btn">Export selected…</button>
          <button id="preset-export-all-btn">Export all…</button>
          <button id="preset-import-btn">Import…</button>
        </div>
      </details>
      <span id="preset-status" role="status" aria-live="polite"></span>
      <input id="preset-file-input" type="file" accept="application/json,.json" hidden />
    </div>
    <div id="dimension-badge" data-tooltip="Read-only. Set from the server's response after a successful Generate, not from the Dimension field below until Generate succeeds.&#10;&#10;This value clamps Projection axis fields and the available plane/axis targets in every N-D transform row.">dimension: <span id="current-dimension">&ndash;</span></div>
  </header>

  <div id="main-layout">
    <aside id="structure-panel" class="panel">
      <h2 data-tooltip="Generates the N-D point set. This is the only panel that can change the dimension, which the Projection panel and N-D transforms both depend on.">Structure</h2>
      <div class="field">
        <label for="structure-type-select" data-tooltip="Chooses which N-D structure generator to use. Changing this rebuilds its parameter fields, including Dimension: most accept 4-12, Root System E_n offers 6/7/8, and Clifford Torus/Klein Bottle are fixed at 4. Click Generate to apply the change.">Type</label>
        <select id="structure-type-select" data-tooltip="Chooses which N-D structure generator to use. Changing this rebuilds its parameter fields, including Dimension: most accept 4-12, Root System E_n offers 6/7/8, and Clifford Torus/Klein Bottle are fixed at 4. Click Generate to apply the change."></select>
      </div>
      <div id="structure-params"></div>
      <button id="generate-btn" class="primary" data-tooltip="Sends the Structure panel's fields to the server and replaces the point cloud in the viewer.&#10;&#10;Also updates the dimension badge, re-clamps every N-D transform and Projection axis field, resets transform phases to zero, rebuilds all Projection fields from their defaults, and automatically re-applies the current projection method.">Generate</button>
      <div id="structure-meta" class="meta-readout" data-tooltip="Read-only summary from the last successful Generate (point count plus structure-specific details, e.g. radius or packing radius). Replaced on every new Generate."></div>
      <div id="structure-error" class="error-readout" data-tooltip="Shows the error message from the last failed Generate attempt (e.g. an out-of-range parameter). Cleared as soon as you click Generate again."></div>
    </aside>

    <main id="viewer-container">
      <canvas id="viewer-canvas" data-tooltip="Left-drag to orbit the camera, scroll to zoom, right-drag to pan.&#10;&#10;These only move the camera viewpoint; they never change the underlying coordinates and are independent of the N-D transform controls applied before projection."></canvas>
      <div id="viewer-hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
    </main>

    <aside id="projection-panel" class="panel">
      <h2 data-tooltip="Flattens the current N-D points to the 3 coordinates the viewer draws. Works with N-D transforms below: transforms are applied first, every frame, then this panel's fixed projection recipe.">Projection</h2>
      <div class="field">
        <label for="projection-method-select" data-tooltip="Chooses how N-D points are flattened to 3D. Changing this rebuilds the parameter fields below, with any axis-type field clamped to the current dimension. Does not re-render the view -- click Apply Projection afterward (the exception is right after Generate, which auto-applies the selected method).">Method</label>
        <select id="projection-method-select" data-tooltip="Chooses how N-D points are flattened to 3D. Changing this rebuilds the parameter fields below, with any axis-type field clamped to the current dimension. Does not re-render the view -- click Apply Projection afterward (the exception is right after Generate, which auto-applies the selected method)."></select>
      </div>
      <div id="projection-params"></div>
      <button id="apply-projection-btn" class="primary" data-tooltip="Computes a projection recipe from the untransformed base points (not the live transformed view) and applies it in the viewer.&#10;&#10;The recipe is fixed once computed: every animation frame applies the N-D transforms first, then this same fixed recipe. PCA/Johnson-Lindenstrauss bases are therefore computed once at Apply time and do not follow active transforms.">Apply Projection</button>
      <div id="projection-error" class="error-readout" data-tooltip="Shows the error message from the last failed Apply Projection attempt (e.g. a custom matrix with the wrong shape). Cleared as soon as you click Apply Projection again."></div>

      <h2 data-tooltip="Transforms the N-D structure itself before projection. Each row explicitly selects Plane rotation or Axis scale, then an available plane or axis. Purely client-side -- only the resulting coordinates are sent when you click Analyze Leakage.">N-D transforms</h2>
      <div id="rotation-controls"></div>
      <button id="add-rotation-btn" data-tooltip="Adds a Plane rotation row using the first coordinate plane not already active. Change its Transform type to Axis scale when you want to stretch, collapse, or reflect one coordinate.">+ Add transform</button>
      <div class="rotation-toolbar">
        <button id="pause-btn" aria-pressed="false" data-tooltip="Pauses every transform exactly where it is: rotations hold their angles and axis scales hold their phases. Click Resume to continue from the same state.">&#9208; Pause</button>
        <button id="reset-rotation-btn" data-tooltip="Resets every plane rotation to angle 0 and every axis scale to phase 0 (factor 1x). Unlike Pause, this discards the current transform state.">Reset transforms</button>
      </div>

      <h2 data-tooltip="Shifts the N-D structure itself before projection, applied every frame after N-D transforms. Purely client-side -- never sent to the server except as part of whatever coordinates Analyze Leakage captures. Resets to 0 on every Generate.">Position</h2>
      <div id="position-controls"></div>
      <div class="position-toolbar">
        <button id="reset-position-btn" data-tooltip="Snaps every Position axis back to 0. N-D transform angles and phases are unchanged.">Reset position</button>
      </div>

      <h2 data-tooltip="Compares whatever is currently on screen (including live rotations, axis scales, and position) to its N-D source, using the server's SciPy implementation. Requires a generated structure and an applied projection first.">Leakage metrics</h2>
      <p class="hint-text">Compares the current N-D point positions to their live 3D projection.</p>
      <button id="analyze-btn" data-tooltip="Sends the exact transformed and positioned N-D points and 3D projection most recently drawn on screen to the server for the five leakage metrics below.&#10;&#10;This differs from Apply Projection (which always uses the untransformed base points), so results can differ between clicks while transforms animate. For reproducible results, click Pause first (or set every transform row's speed to 0).">Analyze Leakage</button>
      <div id="metrics-readout" data-tooltip="Populated by Analyze Leakage. Shows a subset of each metric group's fields -- the full response includes a few extra fields visible only via the browser's network inspector."></div>
    </aside>
  </div>
</div>
<dialog id="preset-name-dialog">
  <form method="dialog" id="preset-name-form">
    <h2 id="preset-name-title">Save preset</h2>
    <label for="preset-name-input">Name</label>
    <input id="preset-name-input" maxlength="80" autocomplete="off" required />
    <div class="dialog-actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="preset-name-confirm" class="primary" value="confirm">Save</button>
    </div>
  </form>
</dialog>
<dialog id="preset-conflict-dialog">
  <form method="dialog">
    <h2>Preset name already exists</h2>
    <p id="preset-conflict-message"></p>
    <div class="dialog-actions dialog-actions-three">
      <button value="cancel">Cancel import</button>
      <button value="copy">Keep both</button>
      <button class="primary" value="replace">Replace</button>
    </div>
  </form>
</dialog>
<script type="module" src="/js/main.js"></script>
</body>
</html>
